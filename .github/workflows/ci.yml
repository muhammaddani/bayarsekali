name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Server tests
        working-directory: server
        run: |
          npm ci
          npm test
      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build
